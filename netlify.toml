[build]
  publish = "public"
  command = ""

# The dashboard is a single static page. All data comes from Supabase Edge
# Functions at runtime; there is no build step and no server-side rendering.
#
# The page lives under public/devdash/ and references its assets as
# /devdash/app.css, /devdash/app.js and /devdash/fonts/*. That base path is
# what lets the main website proxy it at sparcsolutions.org/devdash: absolute
# paths resolve to the same place with or without a trailing slash, where
# relative ones would break on sparcsolutions.org/devdash. Serving from the
# root of this project still works — see the catch-all at the bottom.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # This page shows donor names, addresses and gift amounts once signed in.
    # Keep it out of every index.
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSS and JS are now their own files and the fonts are self-hosted, so no
    # inline execution and no off-domain font host are needed. Everything the
    # page loads comes from 'self'; the only cross-origin traffic is the
    # Supabase API in connect-src.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self';
      font-src 'self';
      img-src 'self' data:;
      connect-src https://ldxpockcgcxvsrbyhcnt.supabase.co;
      form-action 'self';
      frame-ancestors 'none';
      base-uri 'none';
      object-src 'none'
    """

# index.html, app.js and app.css must never be cached, or a deploy will not
# reach anyone who has the page open. Fonts are content-stable and may cache.
[[headers]]
  for = "/devdash/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/devdash/app.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/devdash/app.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/devdash/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anything not matching a real file serves the dashboard, so this project's own
# root URL (sparc-donor-ops.netlify.app) still opens it. force is left off, so
# /devdash/app.css and /robots.txt are served as themselves.
[[redirects]]
  from = "/*"
  to = "/devdash/index.html"
  status = 200
